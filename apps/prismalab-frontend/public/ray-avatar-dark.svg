<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Ray Avatar — Dark mode. Deep circle for use on dark/charcoal UI surfaces. -->
  <defs>
    <clipPath id="clip-d"><circle cx="40" cy="40" r="36"/></clipPath>
  </defs>
  <!-- Circle -->
  <circle cx="40" cy="40" r="36" fill="#1D2028" stroke="#2C3040" stroke-width="0.75"/>
  <!-- Beam -->
  <line x1="11" y1="40" x2="29" y2="40" stroke="#3A4250" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 3 rays (clipped to circle) -->
  <g clip-path="url(#clip-d)">
    <line x1="29" y1="40" x2="66" y2="22" stroke="#7F77DD" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="29" y1="40" x2="68" y2="40" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="29" y1="40" x2="66" y2="58" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Dot on top -->
  <circle cx="29" cy="40" r="2.1" fill="#50586A"/>
</svg>
