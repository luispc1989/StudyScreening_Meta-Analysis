[package]
name = "prismalab-desktop"
version = "0.1.0"
description = "PrismaLab desktop shell"
authors = ["Luis Pinto Coelho"]
edition = "2021"

[lib]
name = "prismalab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
