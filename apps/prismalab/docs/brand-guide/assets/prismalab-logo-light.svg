<svg width="520" height="128" viewBox="0 0 520 128" xmlns="http://www.w3.org/2000/svg">
  <!-- PrismaLab Logo — Light variant (#FFFFFF background) -->
  <!-- Prism -->
  <polygon points="106,15 58,98 154,98" fill="#F4F3EF" stroke="#CBCAC3" stroke-width="1"/>
  <!-- Input beam -->
  <line x1="18" y1="62" x2="79" y2="62" stroke="#CBCAC3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Emission point -->
  <circle cx="133" cy="62" r="3.5" fill="#CBCAC3"/>
  <!-- Spectrum rays -->
  <line x1="133" y1="62" x2="235" y2="22" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="133" y1="62" x2="238" y2="44" stroke="#378ADD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="133" y1="62" x2="240" y2="62" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="133" y1="62" x2="238" y2="80" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="133" y1="62" x2="235" y2="102" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="258" y="79" font-family="'DM Sans', -apple-system, sans-serif" font-size="44" font-size="44"><tspan font-weight="500" fill="#1C1C1A">Prisma</tspan><tspan font-weight="300" fill="#5DCAA5" dx="4">Lab</tspan></text>
  <!-- Tagline -->
  <text x="259" y="106" font-family="'DM Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#888780" letter-spacing="2">research synthesis platform</text>
</svg>
