    <polygon points="106,15 58,98 154,98" fill="#1E1E1E" stroke="#585858" stroke-width="0.8"/>
    <line x1="18" y1="62" x2="79" y2="62" stroke="#585858" stroke-width="1" stroke-linecap="round"/>
    <circle cx="133" cy="62" r="3" fill="#585858"/>
    <line x1="133" y1="62" x2="235" y2="22" stroke="#7F77DD" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="238" y2="44" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="240" y2="62" stroke="#1D9E75" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="238" y2="80" stroke="#EF9F27" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="235" y2="102" stroke="#D85A30" stroke-width="2" stroke-linecap="round"/>
