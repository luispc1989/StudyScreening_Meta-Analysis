<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- PrismaLab Favicon — 32x32 -->
  <rect width="32" height="32" rx="5" fill="#111111"/>
  <!-- Tight prism + rays scaled into 32px, centred at 16,16 -->
  <!-- Mark viewBox: 48 8 198 98 → scale to fit ~26x13 at centre -->
  <!-- Scale: 26/198 = 0.1313. translate: 16 - (48+99)*0.1313 = 16-19.3 = -3.3, 16-(8+49)*0.1313=16-7.5=8.5 -->
  <g transform="translate(-3.3, 8.5) scale(0.1313)">
    <polygon points="106,15 58,98 154,98" fill="#1E1E1E" stroke="#585858" stroke-width="3"/>
    <circle cx="133" cy="62" r="8" fill="#585858"/>
    <line x1="133" y1="62" x2="235" y2="22" stroke="#7F77DD" stroke-width="8" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="238" y2="44" stroke="#378ADD" stroke-width="8" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="240" y2="62" stroke="#1D9E75" stroke-width="8" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="238" y2="80" stroke="#EF9F27" stroke-width="8" stroke-linecap="round"/>
    <line x1="133" y1="62" x2="235" y2="102" stroke="#D85A30" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
