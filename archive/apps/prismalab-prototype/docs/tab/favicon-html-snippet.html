<!-- PrismaLab — Favicon implementation -->
<!-- Place inside <head> -->

<!-- SVG — best quality, modern browsers (Chrome 80+, Firefox 84+, Safari 17+) -->
<link rel="icon" type="image/svg+xml" href="/prismalab-favicon.svg">

<!-- PNG fallbacks -->
<link rel="icon" type="image/png" sizes="32x32" href="/prismalab-favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/prismalab-favicon-16.png">

<!-- Apple devices -->
<link rel="apple-touch-icon" sizes="180x180" href="/prismalab-favicon-180.png">

<!-- ICO — legacy fallback (IE, older browsers) -->
<link rel="shortcut icon" href="/prismalab-favicon.ico">

<!-- PWA -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#111111">
