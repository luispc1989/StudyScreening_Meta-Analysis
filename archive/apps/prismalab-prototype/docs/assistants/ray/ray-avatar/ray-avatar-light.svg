<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Ray Avatar — Light mode. Cream circle for use on white/light UI surfaces. -->
  <!-- Drop shadow filter -->
  <defs>
    <filter id="shadow-l" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/>
    </filter>
    <clipPath id="clip-l"><circle cx="40" cy="40" r="36"/></clipPath>
  </defs>
  <!-- Circle -->
  <circle cx="40" cy="40" r="36" fill="#EDECEA" stroke="#C8C6C2" stroke-width="0.75" filter="url(#shadow-l)"/>
  <!-- Beam -->
  <line x1="11" y1="40" x2="29" y2="40" stroke="#B9B7B2" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Emission dot -->
  <circle cx="29" cy="40" r="2.1" fill="#AFADAA"/>
  <!-- 3 rays (clipped to circle) -->
  <g clip-path="url(#clip-l)">
    <line x1="29" y1="40" x2="66" y2="22" stroke="#7F77DD" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
    <line x1="29" y1="40" x2="68" y2="40" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
    <line x1="29" y1="40" x2="66" y2="58" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
  </g>
  <!-- Dot on top -->
  <circle cx="29" cy="40" r="2.1" fill="#AFADAA"/>
</svg>
